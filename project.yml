name: CameraControlShortcut

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# Team and bundle ID come from Config/Signing.xcconfig (and your gitignored
# Config/Signing.local.xcconfig), so they're not set here.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  CameraControlShortcut:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: CaptureExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        PRODUCT_NAME: CameraControlShortcut
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: CamControl
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSCameraUsageDescription: iOS requires camera access for apps that Camera Control can launch. CamControl never uses the camera.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CaptureExtension:
    type: extensionkit-extension
    platform: iOS
    sources:
      - CaptureExtension
      - Shared
      - App/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).capture
        PRODUCT_NAME: CaptureExtension
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: CaptureExtension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: CamControl
        INFOPLIST_KEY_NSCameraUsageDescription: iOS requires camera access for apps that Camera Control can launch. CamControl never uses the camera.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) CAPTURE_EXTENSION
